[build]
# Dockerfile build = fully deterministic (no Nixpacks lockfile surprises).
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Production process: Next.js server (binds Railway's $PORT automatically).
startCommand = "npm run start"
# Railway healthcheck (returns 200 once env is ready).
healthcheckPath = "/api/health"
healthcheckTimeout = 120
# Restart crashed replicas (web service only).
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
