[phases.setup]
nixPkgs = ["nodejs_20"]

[variables]
NIXPACKS_NODE_VERSION = "20"
# Railway sets production during image build. Next.js still needs devDependencies (typescript).
NPM_CONFIG_PRODUCTION = "false"
NPM_CONFIG_ENGINE_STRICT = "false"

# npm ci fails on this lockfile under Nixpacks Node 20. Use install instead.
[phases.install]
cmds = ["npm install --include=dev --no-audit --no-fund"]
